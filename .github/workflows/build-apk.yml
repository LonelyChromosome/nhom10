name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/dao-core-sync-widget
      - integration/1.0-unified-build

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Bootstrap project
        run: bash tool/bootstrap.sh
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee apk-build.log
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apk-build-diagnostics
          path: apk-build.log
          if-no-files-found: ignore
      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Better-Phenikaa-1.0.apk
          (cd dist && sha256sum Better-Phenikaa-1.0.apk > Better-Phenikaa-1.0.sha256)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Better-Phenikaa-1.0
          path: dist/
          retention-days: 14
          if-no-files-found: error
